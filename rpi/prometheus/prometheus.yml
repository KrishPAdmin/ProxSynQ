global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node_exporter
    static_configs:
      - targets:
          - 10.26.0.170:9100
          - 10.26.0.171:9100
          - 10.26.0.172:9100
          - 10.26.0.173:9100

  - job_name: node_agent
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.26.0.171:8000
          - 10.26.0.172:8000
          - 10.26.0.173:8000
