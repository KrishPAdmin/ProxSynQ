version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: proxsyncq-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: proxsyncq
      RABBITMQ_DEFAULT_PASS: proxsyncqpass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16
    container_name: proxsyncq-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: proxsyncq
      POSTGRES_USER: proxsyncq
      POSTGRES_PASSWORD: proxsyncqpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  rabbitmq_data:
  postgres_data:
